<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      font-size: 32px;
    }
  </style>
  <body>
    <div class="box"></div>
  </body>
  <script>
        let display = document.querySelector('.box');
        
        setInterval(() => {
            let date = new Date();
            display.innerHTML = date.toLocaleTimeString();
        },1000)
        
  </script>
</html>
